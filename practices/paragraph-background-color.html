<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paragraph Background Color</title>

    <style>
      .highlight {
        border: 2px solid orange;
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <p id="paragraph">JavaScript Exercises - Paragraph Background Color</p>

    <button id="backgroundButton">Set Background Color</button>

    <script>
      const backgroundButton = document.getElementById("backgroundButton");

      backgroundButton.addEventListener("click", handleBackgroundButtonClick);

      function handleBackgroundButtonClick() {
        const paragraph = document.getElementById("paragraph");

        paragraph.classList.add("highlight");

        paragraph.style.backgroundColor = "lightblue";
        paragraph.style.color = "navy";
        paragraph.style.fontFamily = "Arial, sans-serif";
      }
    </script>
  </body>
</html>
